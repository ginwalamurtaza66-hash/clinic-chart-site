<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Same policy as the app: no inline script, nothing from a third party. The
     guide is a separate page, so it carries its own header rather than
     inheriting one. guide.js is external precisely so there is no inline
     script to hash -- see stamp_csp_hash.py and invariant 3. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com data:;
  img-src 'self' data:;
  connect-src 'self';
  object-src 'none';
  base-uri 'self';
  form-action 'self';">
<title>Clinic Chart — User Guide</title>
<link rel="icon" href="./favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efece3; --card:#faf7f0; --ink:#14312f; --ink-soft:#6b7a75;
    --line:#ded7c8; --rule:#e6e0d2; --teal:#1f5f5b; --teal-dark:#14403d;
    --teal-tint:#e2ecea; --amber:#c98a2e; --amber-tint:#f6ecd9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.6}
  a{color:var(--teal);text-decoration:none}
  a:hover{text-decoration:underline}
  header{position:sticky;top:0;z-index:20;background:var(--card);
    border-bottom:1px solid var(--rule);padding:12px 18px;
    display:flex;align-items:center;gap:12px}
  header h1{font-family:Fraunces,Georgia,serif;font-size:19px;margin:0;font-weight:600}
  header .tag{font-size:11.5px;color:var(--ink-soft)}
  #menuBtn{margin-left:auto;background:var(--card);border:1px solid var(--line);
    border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer;display:none}
  .wrap{display:grid;grid-template-columns:266px 1fr;gap:0;
    max-width:1180px;margin:0 auto;align-items:start}
  nav{position:sticky;top:56px;max-height:calc(100vh - 56px);overflow:auto;
    padding:20px 12px 40px;border-right:1px solid var(--rule)}
  nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--ink-soft);margin:16px 10px 6px}
  nav a{display:block;padding:7px 10px;border-radius:8px;font-size:13.5px;color:var(--ink)}
  nav a:hover{background:var(--teal-tint);text-decoration:none}
  nav a.on{background:var(--teal);color:#fff;font-weight:600}
  main{padding:26px 30px 80px;min-width:0}
  main h2{font-family:Fraunces,Georgia,serif;font-size:27px;margin:0 0 6px;font-weight:600}
  main h3{font-family:Fraunces,Georgia,serif;font-size:18px;margin:26px 0 8px;font-weight:600}
  main .lede{color:var(--ink-soft);margin:0 0 20px;font-size:14.5px}
  main p{margin:0 0 12px}
  main ol,main ul{margin:0 0 14px;padding-left:22px}
  main li{margin-bottom:6px}
  .note{background:var(--teal-tint);border-left:3px solid var(--teal);
    padding:11px 14px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
  .warn{background:var(--amber-tint);border-left:3px solid var(--amber);
    padding:11px 14px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
  code{background:var(--card);border:1px solid var(--line);border-radius:5px;
    padding:1px 5px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px}
  .path{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:2px 7px;display:inline-block;white-space:nowrap}
  .fig{margin:18px 0;padding:0}
  .fig img{max-width:100%;width:auto;max-height:520px;display:block;
    border:1px solid var(--line);border-radius:10px;background:var(--card)}
  .fig figcaption{font-size:12.5px;color:var(--ink-soft);margin-top:7px}
  .pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px;
    padding-top:18px;border-top:1px solid var(--rule);font-size:13.5px}
  footer{border-top:1px solid var(--rule);padding:18px;text-align:center;
    color:var(--ink-soft);font-size:12px}
  @media (max-width:820px){
    .wrap{grid-template-columns:1fr}
    #menuBtn{display:block}
    nav{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule);display:none}
    nav.open{display:block}
    main{padding:20px 18px 60px}
  }
</style>
</head>
<body>
<header>
  <h1>Clinic Chart</h1>
  <span class="tag">User Guide</span>
  <a href="../" style="font-size:13px;margin-left:14px;color:var(--ink-soft)">← Back to site</a>
  <button id="menuBtn" type="button" aria-expanded="false">Topics</button>
</header>

<div class="wrap">
  <nav id="nav" aria-label="Guide topics"></nav>
  <main id="doc" tabindex="-1">Loading…</main>
</div>

<footer>Clinic Chart — homeopathic clinic management. This guide covers the app as shipped.</footer>

<script src="./guide.js"></script>
</body>
</html>
